name: cotizador_de_productos_locales
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.3
  supabase_flutter: ^2.0.2
  url_launcher: ^6.3.2
  fl_chart: ^0.66.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  tutorial_coach_mark: ^1.2.9
  cached_network_image: ^3.4.1
  google_mobile_ads: ^8.0.0
  app_links: ^7.0.0
  share_plus: ^13.1.0
  qr_flutter: ^4.1.0
  # image_gallery_saver: ^2.0.3
  gal: ^2.3.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.0

dependency_overrides:
  http: ^0.13.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#2E7D32"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
